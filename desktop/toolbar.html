<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data: https: http:; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>Browser</title>
    <style>
      /* The strip and the address row, sized by the shell to the pane's own width. */
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        display: flex;
        flex-direction: column;
        font: 12px/1.2 -apple-system, system-ui, sans-serif;
        background: #202124;
        color: #e8eaed;
        user-select: none;
      }

      /* ── tab strip ───────────────────────────────────────────────────── */
      #strip {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 38px;
        padding: 6px 6px 0;
        box-sizing: border-box;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
      }
      #strip::-webkit-scrollbar { display: none; }
      .tab {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 0 1 190px;
        min-width: 42px;
        height: 32px;
        padding: 0 8px;
        border-radius: 8px 8px 0 0;
        background: transparent;
        cursor: default;
        white-space: nowrap;
        overflow: hidden;
      }
      .tab:hover { background: #2b2c2f; }
      .tab.active { background: #35363a; }
      .tab .favicon { flex: 0 0 auto; width: 14px; height: 14px; object-fit: contain; }
      .tab .glyph { flex: 0 0 auto; width: 14px; height: 14px; display: grid; place-items: center; opacity: 0.6; }
      .tab .label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
      .tab .close {
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
      }
      .tab:hover .close, .tab.active .close { opacity: 0.72; }
      .tab .close:hover { background: rgba(255, 255, 255, 0.16); opacity: 1; }
      #newtab {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        margin-bottom: 3px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
      }
      #newtab:hover { background: #2b2c2f; }

      /* ── address row ─────────────────────────────────────────────────── */
      #bar {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 38px;
        padding: 0 6px;
        box-sizing: border-box;
      }
      .icon {
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: inherit;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
      }
      .icon:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); }
      .icon:disabled { opacity: 0.32; cursor: default; }
      #omnibox {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 10px;
        border-radius: 15px;
        background: #2b2c2f;
        border: 1px solid transparent;
      }
      #omnibox:focus-within { background: #202124; border-color: #8ab4f8; }
      #security { flex: 0 0 auto; font-size: 12px; opacity: 0.85; }
      #security.warn { color: #fdd663; }
      #security.bad { color: #f28b82; }
      #address {
        flex: 1 1 auto;
        min-width: 0;
        border: none;
        background: transparent;
        color: inherit;
        font: inherit;
        outline: none;
      }
      #zoom {
        flex: 0 0 auto;
        font-size: 11px;
        opacity: 0.7;
      }
      #progress {
        position: absolute;
        left: 0;
        top: 75px;
        height: 2px;
        width: 0;
        background: #8ab4f8;
        transition: width 120ms linear;
      }
      #progress.done { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="strip"></div>
    <div id="bar">
      <button class="icon" id="back" title="Back">‹</button>
      <button class="icon" id="forward" title="Forward">›</button>
      <button class="icon" id="reload" title="Reload">⟳</button>
      <div id="omnibox">
        <span id="security" title=""></span>
        <input id="address" spellcheck="false" autocomplete="off" placeholder="Search or type a URL" />
        <span id="zoom"></span>
      </div>
      <button class="icon" id="menu" title="More">⋮</button>
    </div>
    <div id="progress"></div>
    <script src="toolbar.js"></script>
  </body>
</html>
